spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres.bvacjumvqmytgojkwxka}}
spring.datasource.password=${DB_PASSWORD:Razzaq@78612}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# CORS: defaults to *, or can be set via CORS_ALLOWED_ORIGINS (e.g. https://my-frontend.vercel.app)
